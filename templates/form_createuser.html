<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* ---------- Estilos base para los campos de Django ---------- */
        form p {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
        }

        form label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.4rem;
            letter-spacing: 0.01em;
        }

        /* Inputs generales */
        form input[type="text"],
        form input[type="email"],
        form input[type="password"],
        form input[type="number"],
        form input[type="tel"],
        form input[type="url"],
        form select,
        form textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: 1.5px solid #e2e8f0;
            background-color: #f8fafc;
            color: #0f172a;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            outline: none;
        }

        form input[type="text"]:focus,
        form input[type="email"]:focus,
        form input[type="password"]:focus,
        form input[type="number"]:focus,
        form input[type="tel"]:focus,
        form input[type="url"]:focus,
        form select:focus,
        form textarea:focus {
            border-color: #6366f1;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            transform: translateY(-1px);
        }

        form input:hover:not(:focus),
        form select:hover:not(:focus),
        form textarea:hover:not(:focus) {
            border-color: #cbd5e1;
        }

        /* ---------- INPUT DE FECHA (libre, sin restricciones) ---------- */
        form input[type="date"] {
            position: relative;
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: 1.5px solid #c7d2fe;
            background-color: #eef2ff;
            color: #1e1b4b;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: all 0.2s ease;
            outline: none;
            cursor: pointer;
            /* Sin ícono personalizado, se deja el nativo del navegador */
        }

        form input[type="date"]:hover {
            border-color: #818cf8;
            background-color: #e0e7ff;
        }

        form input[type="date"]:focus {
            border-color: #6366f1;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.20);
            transform: translateY(-1px);
        }

        /* Mensajes de ayuda y errores */
        form .helptext {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 0.35rem;
        }

        form ul.errorlist {
            list-style: none;
            padding: 0;
            margin: 0 0 0.35rem 0;
        }

        form ul.errorlist li {
            font-size: 0.78rem;
            color: #dc2626;
            font-weight: 500;
        }

        form input[type="checkbox"] {
            width: 1.1rem;
            height: 1.1rem;
            accent-color: #4f46e5;
            cursor: pointer;
        }
    </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-100 via-indigo-50 to-slate-100 flex items-center justify-center p-6">

    <div class="w-full max-w-md">

        <!-- Card -->
        <div class="bg-white/80 backdrop-blur-xl rounded-2xl shadow-xl shadow-slate-300/40 border border-white/60 p-8">

            <!-- Encabezado -->
            <div class="text-center mb-7">
                <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Crear cuenta</h1>
                <p class="text-sm text-slate-500 mt-1">Completa tus datos para registrarte</p>
            </div>

            <!-- Formulario (sin action ni method, solo decorativo) -->
            <form class="space-y-5" onsubmit="return false;">

                {% csrf_token %}

                {{ form.as_p }}

                <!-- Botón SOLO decorativo (no envía) -->
                <button
                    type="button"
                    class="w-full py-3 px-4 rounded-xl
                           bg-gradient-to-r from-indigo-600 to-violet-600
                           hover:from-indigo-700 hover:to-violet-700
                           active:from-indigo-800 active:to-violet-800
                           text-white font-semibold
                           shadow-lg shadow-indigo-300/50
                           transition-all duration-200
                           hover:-translate-y-0.5
                           focus:outline-none focus:ring-4 focus:ring-indigo-300/50">
                    Crear cuenta
                </button>

            </form>

        </div>

        <p class="text-center text-xs text-slate-400 mt-6">
            © 2026 · Tu aplicación
        </p>

    </div>

</body>
</html>
