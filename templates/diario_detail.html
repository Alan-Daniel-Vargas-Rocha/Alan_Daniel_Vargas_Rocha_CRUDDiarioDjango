<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ entrada.titulo }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-100 via-indigo-50 to-slate-100 flex items-center justify-center p-6">

    <div class="w-full max-w-2xl">

        <div class="bg-white/80 backdrop-blur-xl rounded-2xl shadow-xl shadow-slate-300/40
                    border border-white/60 p-8">

            <!-- Título -->
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight mb-2">
                {{ entrada.titulo }}
            </h1>

            <!-- Fecha (si tienes campo) -->
            {% if entrada.fecha %}
                <p class="text-xs text-slate-400 mb-6">
                    {{ entrada.fecha|date:"d M Y · H:i" }}
                </p>
            {% endif %}

            <!-- Contenido -->
            <div class="prose prose-slate max-w-none text-slate-700 leading-relaxed whitespace-pre-line">
                {{ entrada.contenido }}
            </div>

            <!-- Acciones -->
            <div class="mt-8 pt-6 border-t border-slate-200 flex flex-wrap gap-3 justify-between">
                <a href="{% url 'diario_list' %}"
                   class="px-4 py-2 rounded-xl bg-slate-200 text-slate-700 font-semibold
                          hover:bg-slate-300 transition">
                    ← Volver
                </a>
                <div class="flex gap-2">
                    <a href="{% url 'diario_update' entrada.pk %}"
                       class="px-5 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500
                              text-white font-semibold shadow-md shadow-amber-300/50
                              hover:-translate-y-0.5 transition">
                        ✏️ Editar
                    </a>
                    <a href="{% url 'diario_delete' entrada.pk %}"
                       class="px-5 py-2 rounded-xl bg-gradient-to-r from-red-500 to-rose-500
                              text-white font-semibold shadow-md shadow-red-300/50
                              hover:-translate-y-0.5 transition">
                        🗑️ Eliminar
                    </a>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
